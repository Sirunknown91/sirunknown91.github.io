    <style>
        @font-face {
            font-family: "Alagard";
            src: url("fonts/alagard.ttf") format("truetype");
            font-display: swap;
        }
        /* Colors and Settings */
        :root {
            --bg: #130416;          /* page background */
            --bar: #130416;        /* header bar background */
            --text: #f3f1ec;       /* main text color */
            --accent: #7d0e81;     /* focus outline color */
            --gap: 0px;           /* space between tiles */
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Alagard", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* Header Bar */
        .site-header {
            background: var(--bar);
            padding: 14px 24px;
            display: flex;                 /* puts logo and links in a row */
            align-items: center;           /* vertically centers them */
            justify-content: space-between;/* logo left, links right */
            position: sticky;              /* stays at top while scrolling */
            top: 0;
            z-index: 10;                   /* keeps it above the tiles */
            border-bottom: 3px solid #dfbfe2;
        }

        
        .logo-text { font-size: 2rem; font-weight: normal; color: var(--text); text-decoration: none; }
        .site-header nav a { color: var(--text); text-decoration: none; margin-left: 20px; opacity: .75; }
        .site-header nav a:hover { opacity: 1; }

        /* Grid */
        main {
            flex: 1;                  /* "take all remaining height" */
            display: flex;
            flex-direction: column; 
            width: 100%;
            max-width: 1920px; 
            margin: 0 auto;
        }
        h1 { font-size: 1.8rem; margin: 0 0 0px; }
    
        .grid {
            display: grid;
            flex: 1;                  /* grid takes all of main */
            grid-auto-rows: minmax(240px, 1fr);  
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--gap);
        }

        /* Tile */
        .tile {
            position: relative;      /* lets us place the text on top of the image */
            /*aspect-ratio: 1 / 1;     /* makes it a square. Try 4 / 3 for wider tiles */
            overflow: hidden;        /* IMPORTANT: hides the parts of the image that zoom outside the square */
            display: block;
            border-radius: 0px;
            background: #0e0313;     /* shows if an image is missing */
            color: var(--text);
            text-decoration: none;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;       /* fills the square without stretching the image */
            display: block;
            transition: transform .4s ease;   /* makes the zoom smooth */
        }
        .tile:hover img,
        .tile:focus-visible img {
            transform: scale(1.2);  /* the zoom: 1.12 = 12% bigger. Raise for more */
        }
    
        /* The centered title, over a dark tint so it's readable on any image */
        .tile span {
            position: absolute;
            inset: 33.3% 0 0 0;      /* top right bottom left: starts 1/3 down, fills the rest */
            z-index: 1;
            display: flex;
            align-items: center;     /* vertical center */
            justify-content: center; /* horizontal center */
            text-align: center;
            padding: 12px;
            font-size: 2rem;
            font-weight: normal;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
        }

        .tile::after {
            content: "";
            position: absolute;
            inset: 0;                      /* covers the full tile */
            background: rgba(0, 0, 0, .35);
        }
    
        .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }  /* keyboard users */
    
        /* Respect people who turn off animations in their OS */
        @media (prefers-reduced-motion: reduce) {
            .tile img { transition: none; }
        }




    </style>
</head>

<body>

        </div>
